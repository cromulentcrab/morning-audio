name: Voice samples

# Emails you short samples of several Australian voices. Run it by hand:
# Actions -> Voice samples -> Run workflow.
on:
  workflow_dispatch:

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install feedparser requests trafilatura mutagen
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Make and email the samples
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: python voices.py
